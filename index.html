<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPTG iCar · Smart Fleet Log</title>
<meta name="description" content="IPTG iCar, Smart Fleet Log untuk Institut Pemikiran Tok Guru Dato' Bentara Setia (IPTG). Direka &amp; dibangunkan oleh FAIMS EMPIRE.">
<meta name="apple-mobile-web-app-title" content="IPTG iCar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a7f86">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  html,body{margin:0;height:100%;background:#0a7f86;overflow:hidden}
  iframe{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:#eef8f7}
  html{background:#083b44}
  #splash{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(135deg,#083b44 0%,#0a7f86 55%,#0fb5ae 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease}
  #splash.hilang{opacity:0;pointer-events:none}
  #splash img{width:92px;height:92px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:timbul 1.8s ease-in-out infinite}
  #splash h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.3px}
  #splash h1 span{color:#7ff3ea}
  #splash p{margin:-10px 0 0;font-size:13px;opacity:.85}
  .jalan{position:relative;width:200px;height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
  .jalan:before{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:6px;background:#7ff3ea;animation:pandu 1.2s ease-in-out infinite}
  #mesej{font-size:12.5px;opacity:.8;min-height:16px}
  @keyframes timbul{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pandu{0%{left:-40%}100%{left:100%}}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><h1>IPTG <span>iCar</span></h1><p>Smart Fleet Log</p><div class="jalan"></div><div id="mesej">Menyediakan kenderaan...</div></div>
<iframe id="app" allow="camera; clipboard-write" title="IPTG iCar"></iframe>
<script>
  // Link Web App IPTG iCar (Apps Script). Tukar di sini jika link berubah.
  var WEBAPP = 'https://script.google.com/macros/s/AKfycbw2B1pIutLpgtEJZKp7YcIaDMI8NE_G8QjSVohGTq_rJKkkVmKdN-4ZHJUYLnbVkXI/exec';
  var app = document.getElementById('app'), sp = document.getElementById('splash'), ms = document.getElementById('mesej');
  function tutup(){ sp.classList.add('hilang'); setTimeout(function(){ sp.style.display = 'none'; }, 500); }
  app.addEventListener('load', function(){ setTimeout(tutup, 250); });
  var teks = ['Menyediakan kenderaan...', 'Menyemak status kereta...', 'Hampir siap...'], i = 0;
  var tk = setInterval(function(){ i++; if (i < teks.length) ms.textContent = teks[i]; else clearInterval(tk); }, 1800);
  setTimeout(tutup, 20000);
  app.src = WEBAPP + (location.search || '');
</script>
</body>
</html>
